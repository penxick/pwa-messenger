# Основные настройки backend-приложения и подключения к PostgreSQL.

server:
  port: 8080

spring:
  application:
    name: messenger

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/PenxMessenger_bd}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "format_sql": true